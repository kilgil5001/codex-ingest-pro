[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeline-engine"
version = "0.1.0"
description = "LifeLine Engine MVP orchestration pipeline"
authors = [{name = "LifeLine Platform Team", email = "team@lifeline.engine"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "temporalio>=1.5.0",
    "pydantic>=1.10",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
